server.port=8082

spring.application.name=user-service
spring.application.bad_request=400
spring.application.conflict=409
spring.application.success=200
spring.application.not_found=404

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_NAME}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.config.keycloak.server-url=${KEYCLOAK_SERVER_URL}
app.config.keycloak.realm=${KEYCLOAK_REALM}
app.config.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
app.config.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# JWT Configuration (secret must decode to >= 256 bits for HS256)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000


